# Strompreise : SMARD (Bundesnetzagentur, CC BY 4.0) Day-Ahead je Viertelstunde für DE-LU, AT, NL, BE, PL,
# EZB-Kurs EUR/PLN, CBS StatLine 85592NED. Viermal täglich nach Berliner Zeit (14.30, 17, 20, 23 Uhr) :
# GitHub-Cron läuft in UTC, deshalb je zwei Zeitpunkte (Sommer- und Winterzeit) und ein Filter auf die Berliner Stunde.
name: Strompreise aktualisieren
on:
  schedule:
    - cron: '30 12,13 * * *'
    - cron: '0 15,16,18,19,21,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Berliner Stunde prüfen
        id: zeit
        run: |
          h=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$h" = "14" ] || [ "$h" = "17" ] || [ "$h" = "20" ] || [ "$h" = "23" ]; then echo "los=1" >> "$GITHUB_OUTPUT"; else echo "los=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.zeit.outputs.los == '1'
      - uses: actions/setup-node@v4
        if: steps.zeit.outputs.los == '1'
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --legacy-peer-deps
        if: steps.zeit.outputs.los == '1'
      - name: Daten laden
        if: steps.zeit.outputs.los == '1'
        run: node scripts/update-data.mjs
      - name: Tests und Build
        if: steps.zeit.outputs.los == '1'
        run: npx vitest run && npm run build
      - name: Commit, falls sich Daten geändert haben
        if: steps.zeit.outputs.los == '1'
        run: |
          git config user.name 'Radif Partners'
          git config user.email 'amradif@gmail.com'
          git add src/data/prices src/data/fx-eur-pln.json src/data/cbs-nl.json src/data/meta.json
          git diff --cached --quiet || (git commit -m 'Daten: SMARD-Strompreise, EZB-Kurs, CBS' && git push)
